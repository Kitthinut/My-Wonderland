<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#a8203a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Heartslabyul Room</title>
    <style>
      :root {
        --r: #a8203a;
        --c: #fff3e0;
        --g: #d9a93b;
        --k: #2b1a22;
        --p: #f6d5d9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #2b1218;
        color: var(--k);
        font:
          15px/1.4 Quicksand,
          ui-rounded,
          "Trebuchet MS",
          sans-serif;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      header {
        width: 100%;
        max-width: 520px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
      }
      h1 {
        font:
          700 32px "Dancing Script",
          "Brush Script MT",
          cursive;
        color: #e8c36a;
        margin: 0;
      }
      svg {
        width: 100%;
        max-width: 520px;
        height: auto;
        display: block;
      }
      .f {
        cursor: pointer;
        transition: transform 0.15s;
      }
      .f:hover,
      .f:focus {
        transform: translateY(-3px);
        outline: none;
      }
      .f text {
        font:
          700 11px ui-rounded,
          sans-serif;
        fill: #fff;
        pointer-events: none;
      }
      #m {
        position: fixed;
        inset: 0;
        background: #2b1a2299;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        z-index: 9;
      }
      #m[hidden] {
        display: none;
      }
      .sheet {
        background: var(--c);
        width: 100%;
        max-width: 560px;
        max-height: 90vh;
        overflow: auto;
        border-radius: 22px 22px 0 0;
        border-top: 5px solid var(--g);
        padding: 14px 14px calc(18px + env(safe-area-inset-bottom));
      }
      .sheet > div:first-child {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h3 {
        margin: 0;
        font:
          700 28px "Dancing Script",
          "Brush Script MT",
          cursive;
        color: var(--r);
      }
      h4 {
        margin: 14px 0 6px;
        font:
          700 21px "Dancing Script",
          "Brush Script MT",
          cursive;
        color: var(--r);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        border: 2px solid var(--r);
        border-radius: 12px;
        padding: 8px 10px;
        background: #fff;
        color: var(--k);
        min-width: 0;
      }
      button {
        background: var(--r);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
      }
      button:active {
        transform: scale(0.96);
      }
      button.s {
        padding: 2px 8px;
        background: #fff;
        color: var(--r);
        margin-left: 4px;
      }
      button.on {
        background: var(--g);
        border-color: var(--g);
        color: var(--k);
      }
      input,
      select,
      textarea {
        width: 100%;
        margin: 3px 0;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin: 5px 0;
      }
      .row > input,
      .row > select {
        flex: 1;
      }
      .card {
        background: #fff;
        border-radius: 14px;
        padding: 10px;
        margin: 8px 0;
        border: 2px dashed var(--p);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        text-align: center;
      }
      .grid b {
        padding: 7px 0;
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
      }
      .grid b.on {
        background: var(--r);
        color: #fff;
      }
      .grid u {
        display: block;
        font-size: 9px;
        text-decoration: none;
        color: var(--r);
        min-height: 11px;
      }
      .grid .on u {
        color: #fff;
      }
      .dots {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin: 6px 0;
      }
      .dots a {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--p);
        font-size: 10px;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .dots a.on {
        background: var(--r);
        color: #fff;
      }
      .bar {
        height: 8px;
        background: var(--p);
        border-radius: 6px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--g);
        border-radius: 6px;
      }
      .sum {
        display: flex;
        gap: 6px;
        margin: 8px 0;
      }
      .sum span {
        flex: 1;
        background: #fff;
        border-radius: 12px;
        padding: 6px;
        text-align: center;
      }
      .sum b {
        font-size: 18px;
      }
      .tabs {
        display: flex;
        gap: 6px;
      }
      .tabs button {
        flex: 1;
      }
      .in {
        color: #2a7a4b;
      }
      .out {
        color: var(--r);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chips button {
        background: var(--g);
        border-color: var(--g);
        color: var(--k);
      }
      img {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        object-fit: cover;
      }
      .books {
        display: flex;
        gap: 12px;
      }
      .bk {
        flex: 1;
        height: 150px;
        border-radius: 6px 16px 16px 6px;
        font-size: 17px;
        border-width: 0 0 0 12px;
        border-color: var(--g);
      }
      .bk.m {
        background: #3a2a50;
      }
      .book {
        perspective: 900px;
        background: var(--r);
        padding: 10px 10px 10px 18px;
        border-radius: 6px 14px 14px 6px;
        margin: 8px 0;
      }
      .page {
        background: #fffdf5
          repeating-linear-gradient(transparent 0 27px, #ecdcc8 28px);
        border-radius: 4px 10px 10px 4px;
        padding: 8px;
        transform-origin: left center;
      }
      .page textarea {
        border: 0;
        background: transparent;
        height: 250px;
        font:
          600 20px/28px "Dancing Script",
          "Brush Script MT",
          cursive;
        resize: none;
        margin: 0;
      }
      .f1 {
        animation: f1 0.55s;
      }
      .f2 {
        animation: f2 0.55s;
      }
      @keyframes f1 {
        from {
          transform: rotateY(-100deg);
          opacity: 0.2;
        }
      }
      @keyframes f2 {
        from {
          transform: rotateY(80deg);
          opacity: 0.2;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .f1,
        .f2 {
          animation: none;
        }
        .f {
          transition: none;
        }
      }
      .sheet {
        box-shadow: inset 0 0 0 2px #d9a93b66;
      }
      header button {
        background: #1b0d12;
        color: #e8c36a;
        border-color: #d9a93b;
      }
      .gal {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
        margin-top: 8px;
      }
      .tc {
        background: #fff;
        border-radius: 14px;
        border-top: 5px solid;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: 0 2px 0 #00000014;
      }
      .tc .row {
        margin: 0;
        gap: 6px;
      }
      .tt {
        flex: 1;
        cursor: pointer;
        word-break: break-word;
      }
      .ck {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        padding: 0;
        background: #fff;
        color: var(--r);
        flex: none;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .tags em {
        font-style: normal;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 20px;
        background: var(--p);
      }
      .tags em.od {
        background: #c8102e;
        color: #fff;
      }
      .ed {
        display: grid;
        gap: 5px;
        border-top: 1px dashed var(--p);
        padding-top: 6px;
      }
      .ed label {
        font-size: 12px;
        flex: 1;
      }
      .tabs.sc {
        overflow-x: auto;
        margin-bottom: 8px;
      }
      .tabs.sc button {
        flex: none;
        white-space: nowrap;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      header {
        flex-wrap: wrap;
        gap: 6px;
      }
      .hb {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .hb button {
        padding: 4px 10px;
        font-size: 13px;
      }
      .lv {
        position: relative;
        overflow: hidden;
        background: #1b0d12;
        color: #e8c36a;
        border: 2px solid #d9a93b;
        border-radius: 12px;
        padding: 4px 12px;
        font-weight: 700;
      }
      .lv i {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        background: #e8c36a;
      }
      .arr .w {
        cursor: move;
        filter: drop-shadow(0 0 3px #e8c36a);
      }
      .arr svg {
        touch-action: none;
      }
      .wk {
        display: flex;
        gap: 4px;
        margin: 6px 0;
      }
      .wk a {
        flex: 1;
        text-align: center;
        padding: 6px 0;
        border-radius: 12px;
        cursor: pointer;
      }
      .wk a.on {
        background: #fff;
        box-shadow: 0 2px 0 #00000018;
      }
      .wk small {
        display: block;
        color: #7a6a6f;
      }
      .mgrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin: 6px 0;
      }
      .mc {
        background: #fff;
        border-radius: 14px;
        padding: 8px;
        border: 2px solid var(--p);
        font-size: 12px;
      }
      .mv {
        font-size: 20px;
        font-weight: 700;
      }
      .mv small {
        font-size: 12px;
        margin-left: 2px;
      }
      .meal {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 6px 0;
      }
      .meal img,
      .em {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        object-fit: cover;
        background: var(--p);
        display: grid;
        place-items: center;
        font-size: 22px;
        flex: none;
      }
      .chip {
        display: inline-flex;
      }
      .cats {
        display: flex;
        gap: 6px;
        justify-content: space-between;
      }
      .cat {
        background: transparent;
        border: 0;
        padding: 2px;
        transition: transform 0.15s;
      }
      .cat.on {
        transform: translateY(-5px);
        filter: drop-shadow(0 0 5px #d9a93b);
      }
      .fl {
        font:
          700 17px "Dancing Script",
          cursive;
        color: var(--r);
        display: block;
        margin-top: 8px;
      }
      .page input,
      .page textarea {
        font:
          600 18px/1.3 "Dancing Script",
          "Brush Script MT",
          cursive;
        background: #fff9;
        border: 2px solid var(--p);
        height: auto;
        resize: vertical;
      }
      .sc {
        overflow-x: auto;
      }
      .mt {
        border-collapse: collapse;
        font-size: 11px;
        white-space: nowrap;
      }
      .mt td,
      .mt th {
        border: 1px solid var(--p);
        padding: 3px 5px;
        text-align: right;
      }
      .mt td:first-child {
        text-align: left;
        font-weight: 700;
      }
      .mt .ov {
        background: #c8102e33;
      }
      .mt .bi {
        width: 54px;
        padding: 1px 3px;
        border-width: 1px;
        font-size: 11px;
        border-radius: 6px;
        margin: 0;
      }
      .sb {
        display: flex;
        height: 12px;
        border-radius: 6px;
        overflow: hidden;
      }
      .sb i {
        display: block;
      }
      details summary {
        cursor: pointer;
        font:
          700 21px "Dancing Script",
          cursive;
        color: var(--r);
        margin: 10px 0;
      }
      .av {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #d9a93b;
        color: #1b0d12;
        overflow: hidden;
        margin-right: 6px;
        vertical-align: middle;
        font-size: 12px;
      }
      .av img {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
      .av.big {
        width: 64px;
        height: 64px;
        font-size: 28px;
        margin: 0;
        flex: none;
      }
      .ab {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(14px + env(safe-area-inset-bottom));
        display: flex;
        gap: 8px;
        justify-content: center;
        z-index: 8;
      }
      .ab[hidden] {
        display: none;
      }
      .tc.wide {
        grid-column: 1/-1;
      }
      button.s {
        min-width: 34px;
        min-height: 34px;
      }
      #gear {
        font-size: 20px;
        padding: 2px 10px;
      }
      .lv {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>♥ My Wonderland</h1>
      <div class="hb">
        <span id="lv" class="lv" onclick="A.open('set')"></span
        ><button id="gear" onclick="A.open('set')" aria-label="Settings">
          ⚙
        </button>
      </div>
    </header>
    <svg viewBox="0 0 400 600" aria-label="Cozy room: tap furniture">
      <style>
        .f text.lb {
          fill: #2b1a22;
          font:
            700 17px "Dancing Script",
            "Brush Script MT",
            cursive;
          paint-order: stroke;
          stroke: #fff;
          stroke-width: 4px;
          stroke-linejoin: round;
        }
      </style>
      <defs>
        <pattern id="st" width="24" height="10" patternUnits="userSpaceOnUse">
          <rect width="24" height="10" fill="#6b1c2e" />
          <rect width="12" height="10" fill="#5a1627" />
        </pattern>
        <pattern id="ck" width="50" height="50" patternUnits="userSpaceOnUse">
          <rect width="50" height="50" fill="#f3e6cf" />
          <rect width="25" height="25" fill="#1b0d12" />
          <rect x="25" y="25" width="25" height="25" fill="#1b0d12" />
        </pattern>
        <pattern id="dg" width="12" height="10" patternUnits="userSpaceOnUse">
          <rect x="1" y="1" width="9" height="7" rx="2" fill="#f6d5d9" />
        </pattern>
        <g id="ro">
          <circle r="8" fill="#c8102e" />
          <path
            d="M-4.5 0a4.5 4.5 0 0 1 9 0a2.8 2.8 0 0 1-5.6 0a1.6 1.6 0 0 1 3.2 0"
            fill="none"
            stroke="#6b0f1e"
            stroke-width="1.3"
          />
          <path d="M-9 5l-5 3 6 1zM9 5l5 3-6 1z" fill="#3f7a52" />
        </g>
        <path id="h" d="M0 7C-12-3-5-13 0-5 5-13 12-3 0 7Z" />
      </defs>
      <rect width="400" height="350" fill="url(#st)" />
      <rect y="262" width="400" height="76" fill="#22100f" />
      <rect y="259" width="400" height="6" fill="#d9a93b" />
      <path d="M0 300h400" stroke="#d9a93b" stroke-width="1" opacity=".5" />
      <rect y="336" width="400" height="14" fill="#8a1c33" />
      <rect y="350" width="400" height="250" fill="url(#ck)" />
      <g id="rs">
        <use href="#ro" x="24" y="24" fill="#c8102e" stroke="none" />
        <use href="#h" x="53" y="24" fill="#d9a93b" stroke="none" />
        <use href="#ro" x="82" y="24" fill="#c8102e" stroke="none" />
        <use href="#h" x="111" y="24" fill="#d9a93b" stroke="none" />
        <use href="#ro" x="140" y="24" fill="#c8102e" stroke="none" />
        <use href="#h" x="169" y="24" fill="#d9a93b" stroke="none" />
        <use href="#ro" x="198" y="24" fill="#c8102e" stroke="none" />
        <use href="#h" x="227" y="24" fill="#d9a93b" stroke="none" />
        <use href="#ro" x="256" y="24" fill="#c8102e" stroke="none" />
        <use href="#h" x="285" y="24" fill="#d9a93b" stroke="none" />
        <use href="#ro" x="314" y="24" fill="#c8102e" stroke="none" />
        <use href="#h" x="343" y="24" fill="#d9a93b" stroke="none" />
        <use href="#ro" x="372" y="24" fill="#c8102e" stroke="none" />
      </g>
      <path
        d="M10 34Q105 48 200 34T390 34"
        fill="none"
        stroke="#d9a93b"
        stroke-width="1.5"
      />
      <g stroke="#1b0d12" stroke-width="2.5" stroke-linejoin="round">
        <g>
          <rect x="178" y="56" width="92" height="104" rx="4" fill="#cfe8f0" />
          <ellipse cx="206" cy="84" rx="16" ry="7" fill="#fff" stroke="none" />
          <ellipse cx="240" cy="108" rx="14" ry="6" fill="#fff" stroke="none" />
          <path
            d="M224 56v104M178 108h92"
            fill="none"
            stroke="#fff3e0"
            stroke-width="5"
          />
          <path
            d="M172 54h26l-6 104h-20zM276 54h-26l6 104h20z"
            fill="#b32642"
          />
          <path d="M166 50h118" stroke="#d9a93b" stroke-width="4" />
          <rect x="172" y="160" width="104" height="7" rx="2" fill="#fff3e0" />
        </g>
        <ellipse cx="210" cy="448" rx="124" ry="38" fill="#b32642" />
        <ellipse
          cx="210"
          cy="448"
          rx="108"
          ry="30"
          fill="none"
          stroke="#d9a93b"
        />
        <g transform="translate(300 0)">
          <path d="M22 478h36" stroke="none" />
          <ellipse cx="42" cy="478" rx="14" ry="5" fill="#7a1f2e" />
          <path d="M42 478V404" fill="none" stroke="#7a1f2e" stroke-width="4" />
          <path d="M24 404l8-28h20l8 28z" fill="#d9a93b" />
        </g>
        <g transform="translate(-300 0)">
          <path d="M340 446h30l-4 26h-22z" fill="#b32642" />
          <g fill="#6aa57a">
            <ellipse
              cx="348"
              cy="428"
              rx="7"
              ry="17"
              transform="rotate(-25 348 428)"
            />
            <ellipse
              cx="362"
              cy="426"
              rx="7"
              ry="17"
              transform="rotate(25 362 426)"
            />
            <ellipse cx="355" cy="420" rx="6" ry="18" />
          </g>
        </g>
        <g class="w" data-k="cal" data-b="0 0">
          <g
            class="f"
            onclick="A.open('cal')"
            role="button"
            tabindex="0"
            aria-label="Calendar"
          >
            <g class="fb">
              <path d="M60 40v12" fill="none" stroke="#d9a93b" />
              <rect x="22" y="52" width="76" height="90" rx="6" fill="#fff" />
              <path
                d="M22 74V58a6 6 0 0 1 6-6h64a6 6 0 0 1 6 6v16z"
                fill="#b32642"
              />
              <circle cx="42" cy="52" r="3.5" fill="#d9a93b" />
              <circle cx="78" cy="52" r="3.5" fill="#d9a93b" />
              <rect
                x="28"
                y="80"
                width="64"
                height="54"
                fill="url(#dg)"
                stroke="none"
              />
              <use href="#h" x="66" y="108" fill="#b32642" stroke="none" />
            </g>
            <image
              href="assets/calendar.png"
              x="18"
              y="40"
              width="84"
              height="106"
              preserveAspectRatio="xMidYMax meet"
              visibility="hidden"
              onload="
                this.setAttribute('visibility', 'visible');
                this.parentNode.querySelector('.fb').style.display = 'none';
              "
            />
            <text class="lb" x="60" y="162" text-anchor="middle">Calendar</text>
          </g>
        </g>
        <g class="w" data-k="hab" data-b="0 0">
          <g
            class="f"
            onclick="A.open('hab')"
            role="button"
            tabindex="0"
            aria-label="Habit board"
          >
            <g class="fb">
              <rect
                x="280"
                y="46"
                width="104"
                height="92"
                rx="6"
                fill="#a8742f"
              />
              <rect
                x="287"
                y="53"
                width="90"
                height="78"
                rx="3"
                fill="#ecc98e"
              />
              <rect
                x="294"
                y="60"
                width="36"
                height="30"
                fill="#ffd0dc"
                transform="rotate(-5 312 75)"
              />
              <rect
                x="336"
                y="62"
                width="34"
                height="30"
                fill="#fff2a8"
                transform="rotate(4 353 77)"
              />

    <script src="firebase-config.js"></script>
    <script>
      const FB_KEY = "hl_fb",
        storedFB = () => {
          try {
            return JSON.parse(localStorage[FB_KEY] || "null");
          } catch {
            return null;
          }
        },
        FB = storedFB() || window.FIREBASE_CONFIG || {};
      const KEY = "hl1",
        $ = (s) => document.querySelector(s),
        v = (i) => document.getElementById(i).value,
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          ),
        td = (d = new Date()) =>
          new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10),
        ago = (n) => td(new Date(Date.now() - n * 864e5)),
        last = (n) => [...Array(n)].map((_, i) => ago(n - 1 - i)),
        id = () => Math.random().toString(36).slice(2, 9),
        pad = (n) => String(n).padStart(2, 0),
        sel = (i, d = 3) =>
          `<select id=${i}>${[1, 2, 3, 4, 5].map((n) => `<option ${n == d ? "selected" : ""}>${n}</option>`).join("")}</select>`;
      const D = {
        habits: [],
        hl: {},
        notes: {},
        food: [],
        favs: [],
        money: [],
        books: { j: [], m: [] },
        tasks: [],
        rewards: [],
        pts: 0,
        claimed: 0,
        xp: 0,
        focus: {},
        prof: { name: "", img: "" },
        bud: {},
        goals: { k: 2000, p: 100, c: 250, f: 65 },
        tv: [],
        radio: [],
        pos: {},
        t: 0,
      };
      let S = { ...D, ...JSON.parse(localStorage[KEY] || "{}") },
        uid,
        tok,
        fb,
        tm,
        cur,
        curF;
      const push = () => {
        if (uid) fb.s.setDoc(fb.s.doc(fb.db, "users", uid), S);
      };
      const save = () => {
        S.t = Date.now();
        localStorage[KEY] = JSON.stringify(S);
        badge();
        clearTimeout(tm);
        tm = setTimeout(push, 600);
      };
      const R = () => cur && cur(),
        show = (t, f) => {
          curF = f;
          dc = null;
          $("#ti").textContent = t;
          $("#m").hidden = false;
          cur = () => {
            $("#bd").innerHTML = f();
          };
          R();
        };
      // ---------- calendar
      let cm = new Date(),
        cd = td(),
        evs = [];
      const ed = (e) => (e.start.date || e.start.dateTime).slice(0, 10);
      async function gcal(p, o = {}) {
        if (!tok) throw 0;
        const r = await fetch(
          "https://www.googleapis.com/calendar/v3/calendars/primary/events" + p,
          {
            ...o,
            headers: {
              Authorization: "Bearer " + tok,
              "Content-Type": "application/json",
            },
          },
        );
        if (r.status == 401) {
          tok = null;
          throw 0;
        }
        return r.json();
      }
      async function loadEv() {
        if (!tok) return R();
        const y = cm.getFullYear(),
          m = cm.getMonth();
        try {
          const j = await gcal(
            "?singleEvents=true&orderBy=startTime&maxResults=250&timeMin=" +
              new Date(y, m, 1).toISOString() +
              "&timeMax=" +
              new Date(y, m + 1, 1).toISOString(),
          );
          evs = j.items || [];
        } catch {
          evs = [];
        }
        R();
      }
      const vCal = () => {
        if (!tok)
          return `<p>Sign in with Google to see and add your plans.</p><button onclick="A.login()">Sign in with Google</button>`;
        const y = cm.getFullYear(),
          m = cm.getMonth(),
          f = new Date(y, m, 1).getDay(),
          n = new Date(y, m + 1, 0).getDate();
        let g = "<i></i>".repeat(f);
        for (let d = 1; d <= n; d++) {
          const k = `${y}-${pad(m + 1)}-${pad(d)}`,
            c = evs.filter((e) => ed(e) == k).length;
          g += `<b class="${k == cd ? "on" : ""}" onclick="A.day('${k}')">${d}<u>${c ? "♥" : ""}</u></b>`;
        }
        return (
          `<div class=row><button class=s onclick="A.nav(-1)">◀</button><b>${cm.toLocaleString("en", { month: "long", year: "numeric" })}</b><button class=s onclick="A.nav(1)">▶</button></div><div class=grid>${g}</div><h4>${cd}</h4>` +
          (evs
            .filter((e) => ed(e) == cd)
            .map(
              (e) =>
                `<div class=card>${e.start.dateTime ? e.start.dateTime.slice(11, 16) : "All day"} · ${esc(e.summary)}</div>`,
            )
            .join("") || "<p>No plans yet.</p>") +
          `<input id=et placeholder="New plan"><div class=row><input id=es type=time value=09:00><input id=ee type=time value=10:00></div><button onclick="A.cadd()">Add to Google Calendar</button>`
        );
      };
      // ---------- habits
      let hx = null,
        dc = null;
      const sure = (i) => {
        if (dc != i) {
          dc = i;
          R();
          return 0;
        }
        dc = null;
        return 1;
      };
      const HC = [
          "#c8102e",
          "#e8833a",
          "#d9a93b",
          "#6aa57a",
          "#4b8bb3",
          "#7b5ea7",
          "#d6609a",
        ],
        hc = (i) => HC[i % 7],
        f1 = (x) => x.toFixed(1);
      const streak = (h) => {
        let n = 0;
        for (let i = 0; ; i++) {
          if (S.hl[ago(i) + h]) n++;
          else if (i > 0) break;
        }
        return n;
      };
      const ring = (p, c) =>
        `<svg width="46" height="46" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#f1e3e5" stroke-width="4"/><circle cx="18" cy="18" r="15" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${p * 0.9425} 94.25" transform="rotate(-90 18 18)"/><text x="18" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#2b1a22">${p}%</text></svg>`;
      const radial = () => {
        const H = S.habits;
        if (!H.length) return "";
        const t = new Date(),
          y = t.getFullYear(),
          m = t.getMonth(),
          n = new Date(y, m + 1, 0).getDate(),
          sp = Math.min(17, 150 / H.length),
          r0 = 46;
        let dn = 0,
          tt = 0,
          o = "";
        H.forEach((h, i) => {
          const r = r0 + i * sp;
          for (let d = 1; d <= n; d++) {
            const k = `${y}-${pad(m + 1)}-${pad(d)}`,
              a = ((d - 1) / n) * 6.2832 - 1.5708,
              on = S.hl[k + h.id];
            if (k <= td()) {
              tt++;
              if (on) dn++;
            }
            o += `<circle cx="${f1(200 + r * Math.cos(a))}" cy="${f1(200 + r * Math.sin(a))}" r="${f1(sp * 0.4)}" fill="${on ? hc(i) : "#f1e3e5"}" stroke="${k == td() ? "#2b1a22" : "none"}" onclick="A.tick('${k}','${h.id}')"/>`;
          }
        });
        const R2 = r0 + H.length * sp + 6;
        for (let d = 1; d <= n; d++)
          if (d == 1 || d % 5 == 0) {
            const a = ((d - 1) / n) * 6.2832 - 1.5708;

              96,
            );
            S.prof.img = c.toDataURL("image/jpeg", 0.7);
            save();
            R();
          };
          im.src = URL.createObjectURL(f);
        },
        inst: async () => {
          if (dip) {
            dip.prompt();
          } else
            alert(
              "On iPhone/iPad: tap Share, then Add to Home Screen. On Android: open the browser menu and tap Install app.",
            );
        },
        tmode: (k) => {
          clearInterval(T.iv);
          T.run = 0;
          T.m = k;
          T.left = dur[k];
          R();
        },
        trs: () => {
          clearInterval(T.iv);
          T.run = 0;
          T.left = dur[T.m];
          R();
        },
        tgo: () => {
          if (T.run) {
            clearInterval(T.iv);
            T.run = 0;
            T.left = Math.ceil((T.end - Date.now()) / 1000);
          } else {
            T.end = Date.now() + T.left * 1000;
            T.run = 1;
            T.iv = setInterval(tick2, 500);
          }
          R();
        },
        vadd: () => {
          const n = v("vn").trim();
          if (n) {
            S.tv.push({ id: id(), n, k: v("vk"), s: 0 });
            save();
            R();
          }
        },
        vnext: (i) => {
          const x = S.tv.find((y) => y.id == i);
          x.s = (x.s + 1) % 3;
          if (x.s == 2) xp(5);
          save();
          R();
        },
        vdel: (i) => {
          S.tv = S.tv.filter((x) => x.id != i);
          save();
          R();
        },
        oadd: () => {
          const n = v("rdn").trim();
          let u = v("rdu").trim();
          if (!n || !u) return;
          if (!/^https?:\/\//i.test(u)) u = "https://" + u;
          S.radio.push({ id: id(), n, u });
          save();
          R();
        },
        odel: (i) => {
          S.radio = S.radio.filter((x) => x.id != i);
          save();
          R();
        },
        rdel: (i) => {
          S.rewards = S.rewards.filter((x) => x.id != i);
          save();
          R();
        },
      };
      document
        .querySelectorAll(".f")
        .forEach((g) => (g.onkeydown = (e) => e.key == "Enter" && g.onclick()));
      // ---------- Firebase sync (loads only when configured; app works locally without it)
      (async () => {
        if (!FB.apiKey) return;
        try {
          const u = "https://www.gstatic.com/firebasejs/10.12.2/firebase-",
            [a, p, s] = await Promise.all(
              ["app", "auth", "firestore"].map((m) => import(u + m + ".js")),
            ),
            app = a.initializeApp(FB);
          fb = { a: p, s, auth: p.getAuth(app), db: s.getFirestore(app) };
          p
            .getRedirectResult(fb.auth)
            .then((r) => {
              if (r)
                tok = p.GoogleAuthProvider.credentialFromResult(r).accessToken;
              if (sessionStorage.getItem("hl_autologin")) {
                sessionStorage.removeItem("hl_autologin");
                A.login();
              } else if (r) loadEv();
            })
            .catch(console.log);
          p.onAuthStateChanged(fb.auth, (us) => {
            uid = us?.uid;
            acct = us?.email || "";
            if (curF == vSet) R();
            if (uid)
              s.onSnapshot(s.doc(fb.db, "users", uid), (d) => {
                const r = d.data();
                if (!r) return push();
                if (r.t > S.t) {
                  S = { ...D, ...r };
                  localStorage[KEY] = JSON.stringify(S);
                  applyPos();
                  badge();
                  if (!document.activeElement.matches("input,textarea")) R();
                }
              });
          });
        } catch (e) {
          console.log(e);
        }
      })();
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("sw.js");
    </script>
    <div id="ab" class="ab" hidden>
      <button onclick="A.arr()">✅ Done arranging</button
      ><button class="s" onclick="A.rlay()">↺ Reset</button>
    </div>
    <div id="m" hidden onclick="event.target.id == 'm' && A.close()">
      <div class="sheet" role="dialog" aria-labelledby="ti">
        <div>
          <h3 id="ti"></h3>
          <button class="s" onclick="A.close()" aria-label="Close">✕</button>
        </div>
        <div id="bd"></div>
      </div>
    </div>
  </body>
</html>
